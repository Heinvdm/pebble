<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Pebble</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;left:0;top:0;width:100vw;height:100vh;display:block;image-rendering:pixelated;image-rendering:crisp-edges;cursor:pointer}
#dbg{position:fixed;left:6px;top:6px;color:#7f7;font:11px/1.3 monospace;white-space:pre;pointer-events:none;display:none;text-shadow:0 0 2px #000}
#teach{position:fixed;right:8px;top:8px;max-width:38vw;color:#cfe;font:13px/1.35 sans-serif;pointer-events:none;display:none;text-shadow:0 0 3px #000}
#teach b{display:inline-block;padding:2px 8px;border-radius:9px;background:#2a6;color:#fff;font-weight:600;margin-bottom:4px}
#teach ol{margin:2px 0 0 18px;padding:0}
#pad{position:fixed;left:0;right:0;bottom:0;height:34vh;display:none;pointer-events:none}
#stick{position:absolute;left:3vw;bottom:3vh;width:26vh;height:26vh;border-radius:50%;background:rgba(80,170,130,.18);border:2px solid rgba(160,230,200,.5);pointer-events:auto;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:9vh;height:9vh;margin:-4.5vh 0 0 -4.5vh;border-radius:50%;background:rgba(170,240,210,.7)}
#keys{position:absolute;right:3vw;bottom:3vh;display:flex;flex-wrap:wrap;gap:6px;max-width:42vw;justify-content:flex-end;pointer-events:auto}
#keys button{font:15px sans-serif;padding:8px 12px;border-radius:10px;border:1px solid #6b9;background:rgba(20,50,40,.75);color:#dfe;touch-action:manipulation}
</style>
</head>
<body>
<canvas id="screen"></canvas>
<div id="dbg"></div>
<div id="teach"><b>Learning</b><ol id="steps"></ol></div>
<div id="pad"><div id="stick"><div id="knob"></div></div><div id="keys"><button data-pad="tilt" data-way="up">Head up</button><button data-pad="tilt" data-way="down">Head down</button><button data-pad="face" data-face="happy">Happy</button><button data-pad="face" data-face="surprised">Surprised</button><button data-pad="face" data-face="love">Love</button><button data-pad="face" data-face="sad">Sad</button><button data-pad="stop">Stop</button></div></div>
<script id="registry" type="application/json">__PEBBLE_REGISTRY__</script>
<script id="eyes" type="application/json">__PEBBLE_EYES__</script>
<script>
"use strict";
(() => {
const cv = document.getElementById("screen");
const ctx = cv.getContext("2d", { alpha: false });
const dbg = document.getElementById("dbg");
const DEBUG = /(^|[?&])debug\b/.test(location.search);
const BG = [0, 0, 0];
const WHITE = [255, 255, 255];
const FACE_C = [120, 236, 255];
const DARK = [10, 14, 30];
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => (v + 0.5) / 16);
const SPD = { slow: 0.55, normal: 1, fast: 1.8 };
const SKY = {
  day: ["#5fb8ff", "#8fd0ff", "#c4e9ff"],
  night: ["#04061a", "#0b1238", "#1b2456"],
  dusk: ["#1f1446", "#6a2c70", "#f0725c"],
  dawn: ["#3a4f9a", "#f6a57a", "#ffe0a8"],
  storm: ["#151a24", "#262d3c", "#3a4255"],
  space: ["#000000", "#03030c", "#080818"]
};
const RAINBOW = ["#ef4646", "#ff9a3c", "#ffd23f", "#3fbf5f", "#3b8bf6", "#9b6bff"];
const FONT_SRC = "A25755 B65656 C34443 D65556 E74647 F74644 G34553 H55755 I72227 J11152 K55655 L44447 M57755 N65555 O25552 P65644 Q25563 R65655 S34216 T72222 U55557 V55552 W55775 X55255 Y55222 Z71247 075557 126227 261247 361216 455711 574616 634757 771222 875757 975716 !22202 ?61202 .00002 ,00024 '22000 +02720 :02020 -00700";
const FONT = {};
FONT_SRC.split(" ").forEach(g => { FONT[g[0]] = g.slice(1).split("").map(Number); });

let REG = null;
let PAL = {};
let W = 64, H = 32, OX = 16, OY = 0, img = null, d = null;
let LA = 1;
const SHIFT_S = 120;
const SHIFT_PATH = [];
[-1, 0, 1].forEach((y, row) => { for (let i = 0; i < 5; i++) SHIFT_PATH.push([row % 2 ? 2 - i : i - 2, y]); });
const MARK_PATH = [[0, 0], [1, 0], [1, 1], [0, 1]];
const SH = { x: 0, y: 0, mx: 0, my: 0 };
function shiftAt(t) {
  const k = Math.floor(t / SHIFT_S), span = SHIFT_PATH.length - 1, i = k % (2 * span);
  const p = SHIFT_PATH[i <= span ? i : 2 * span - i], m = MARK_PATH[k % MARK_PATH.length];
  SH.x = p[0]; SH.y = p[1]; SH.mx = m[0]; SH.my = m[1];
}

function hex(h) {
  const v = parseInt(String(h).replace("#", ""), 16);
  return [(v >> 16) & 255, (v >> 8) & 255, v & 255];
}
function mix(a, b, t) {
  return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
}
function shade(c, k) {
  if (k === 1 || k === undefined) return c;
  if (k > 1) return mix(c, WHITE, Math.min(1, k - 1));
  return [c[0] * k, c[1] * k, c[2] * k];
}
function colour(name, fallback) {
  return PAL[name] || PAL[fallback] || WHITE;
}
function hash(n) {
  n = n | 0;
  n = Math.imul(n ^ (n >>> 16), 0x45d9f3b);
  n = Math.imul(n ^ (n >>> 16), 0x45d9f3b);
  n = n ^ (n >>> 16);
  return (n >>> 0) / 4294967296;
}
function noise(seed, t) {
  const i = Math.floor(t), f = t - i, u = f * f * (3 - 2 * f);
  const a = hash(Math.imul(seed | 0, 7919) + i), b = hash(Math.imul(seed | 0, 7919) + i + 1);
  return a + (b - a) * u;
}
function snoise(seed, t) {
  return noise(seed, t) * 2 - 1;
}
function seeded(seed) {
  let s = seed >>> 0;
  return () => {
    s = (s + 0x6d2b79f5) >>> 0;
    let r = Math.imul(s ^ (s >>> 15), 1 | s);
    r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r;
    return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
  };
}
function strHash(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619);
  return h >>> 0;
}

function resize() {
  const vw = Math.max(1, window.innerWidth), vh = Math.max(1, window.innerHeight);
  if (vw >= vh) {
    H = 32;
    W = Math.max(32, Math.round(32 * vw / vh));
  } else {
    W = 32;
    H = Math.max(32, Math.round(32 * vh / vw));
  }
  OX = Math.floor((W - 32) / 2);
  OY = Math.floor((H - 32) / 2);
  cv.width = W;
  cv.height = H;
  img = ctx.createImageData(W, H);
  d = img.data;
  shown = null;
}

function px(x, y, c, a) {
  x = Math.floor(x);
  y = Math.floor(y);
  if (x < 0 || y < 0 || x >= W || y >= H) return;
  const k = (a === undefined ? 1 : a) * LA;
  if (k <= 0.004) return;
  const i = (y * W + x) << 2;
  if (k >= 1) {
    d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2];
    return;
  }
  d[i] += (c[0] - d[i]) * k;
  d[i + 1] += (c[1] - d[i + 1]) * k;
  d[i + 2] += (c[2] - d[i + 2]) * k;
}
function fill(c) {
  for (let i = 0; i < d.length; i += 4) {
    d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2]; d[i + 3] = 255;
  }
}
function box(x, y, w, h, c, a) {
  for (let yy = Math.floor(y); yy < y + h; yy++) for (let xx = Math.floor(x); xx < x + w; xx++) px(xx, yy, c, a);
}
function seg(x0, y0, x1, y1, c, a) {
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx + dy, guard = 0;
  while (guard++ < 400) {
    px(x0, y0, c, a);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * err;
    if (e2 >= dy) { err += dy; x0 += sx; }
    if (e2 <= dx) { err += dx; y0 += sy; }
  }
}
function glyph(ch) {
  return FONT[String(ch).toUpperCase()] || null;
}
function textWidth(s) {
  return s.length * 4 - 1;
}

function motionOf(name, t, ph, speed) {
  const m = { dx: 0, dy: 0, a: 0, k: 1, s: 1, drift: false };
  const v = speed || 1;
  switch (name) {
    case "twinkle": m.k = 0.45 + 0.55 * noise((ph * 1000) | 0, t * 3.2 * v); break;
    case "drift": m.dx = t * 1.7 * v + ph * 3; m.dy = Math.sin(t * 0.9 * v + ph) * 0.8; m.drift = true; break;
    case "bounce": m.dy = -Math.abs(Math.sin(t * 2.6 * v + ph)) * 3; break;
    case "pulse": m.s = 1 + 0.2 * Math.sin(t * 3 * v + ph); m.k = 0.88 + 0.12 * Math.sin(t * 3 * v + ph); break;
    case "sway": m.dx = Math.sin(t * 1.5 * v + ph) * 1.3; m.a = Math.sin(t * 1.5 * v + ph) * 0.14; break;
    case "spin": m.a = t * 1.5 * v + ph; break;
  }
  return m;
}
function wrapX(x, pad) {
  const span = W + pad * 2;
  return ((x + pad) % span + span) % span - pad;
}
function stamp(ax, ay, ext, fn, m, a) {
  const s = m.s || 1, ang = m.a || 0, ca = Math.cos(-ang), sa = Math.sin(-ang);
  const reach = Math.ceil(ext * Math.max(1, s)) + 1;
  const bx = Math.round(m.drift ? wrapX(ax + m.dx, reach) : ax + m.dx), by = Math.round(ay + m.dy);
  for (let y = -reach; y <= reach; y++) {
    for (let x = -reach; x <= reach; x++) {
      let lx = x, ly = y;
      if (ang) { const rx = lx * ca - ly * sa, ry = lx * sa + ly * ca; lx = rx; ly = ry; }
      if (s !== 1) { lx /= s; ly /= s; }
      const c = fn(Math.round(lx), Math.round(ly));
      if (c) px(bx + x, by + y, shade(c, m.k), c.length > 3 ? c[3] * (a === undefined ? 1 : a) : a);
    }
  }
}
function sprite(rows, palette) {
  const h = rows.length, w = rows[0].length, ox = Math.floor(w / 2), oy = Math.floor(h / 2);
  return (lx, ly) => {
    const r = rows[ly + oy];
    if (!r) return null;
    const ch = r[lx + ox];
    return ch && ch !== "." ? palette[ch] || null : null;
  };
}

const R = {};
R.sky = (e, t) => {
  const p = (SKY[e.look] || SKY.day).map(hex);
  const bands = p.length - 1;
  for (let y = 0; y < H; y++) {
    const f = (y / Math.max(1, H - 1)) * bands;
    const band = Math.min(bands - 1, Math.floor(f)), local = f - band;
    for (let x = 0; x < W; x++) px(x, y, local > BAYER[(y & 3) * 4 + (x & 3)] ? p[band + 1] : p[band]);
  }
  if (e.look === "space") {
    const r = seeded(e.seed);
    for (let i = 0; i < W * H / 40; i++) px(r() * W, r() * H, [200, 200, 230], 0.35 + r() * 0.4);
  }
  if (e.look === "storm") {
    const p2 = 5.3, ph = (t + e.ph) % p2;
    if (ph < 0.18) box(0, 0, W, H, WHITE, 0.18 * (1 - ph / 0.18));
  }
};
R.stars = (e, t) => {
  const r = seeded(e.seed), c = e.c, m = motionOf(e.motion, t, e.ph);
  for (let i = 0; i < e.n; i++) {
    let x = r() * W, y = r() * H * 0.78;
    const ph = r() * 50, big = r() < 0.12;
    let k = 1;
    if (e.motion === "twinkle") k = 0.25 + 0.75 * noise(e.seed + i * 13, t * (1.5 + ph % 2));
    else if (e.motion === "drift") x = wrapX(x + t * (0.6 + (ph % 1) * 0.8), 1);
    else if (e.motion === "spin") {
      const cx = W / 2, cy = H / 2, ang = t * 0.06, dx = x - cx, dy = y - cy;
      x = cx + dx * Math.cos(ang) - dy * Math.sin(ang);
      y = cy + dx * Math.sin(ang) + dy * Math.cos(ang);
    } else { x += m.dx; y += m.dy; k = m.k; }
    const col = shade(c, k);
    px(x, y, col);
    if (big && k > 0.6) {
      px(x - 1, y, col, 0.35); px(x + 1, y, col, 0.35); px(x, y - 1, col, 0.35); px(x, y + 1, col, 0.35);
    }
  }
};
R.moon = (e, t) => {
  const r = e.r, c = e.c, dim = shade(c, 0.78), rs = seeded(e.seed);
  const craters = [[Math.round((rs() - 0.5) * r), Math.round((rs() - 0.5) * r)], [Math.round((rs() - 0.5) * r), Math.round((rs() - 0.5) * r)]];
  stamp(OX + e.x, OY + e.y, r + 1, (x, y) => {
    const dd = x * x + y * y;
    if (dd <= r * r + r * 0.6) {
      for (const k of craters) if (r > 2 && (x - k[0]) * (x - k[0]) + (y - k[1]) * (y - k[1]) <= (r > 4 ? 1.5 : 0.5)) return dim;
      return c;
    }
    if (dd <= (r + 1) * (r + 1) + r) return [c[0], c[1], c[2], 0.18];
    return null;
  }, motionOf(e.motion, t, e.ph));
};
R.sun = (e, t) => {
  const r = e.r, c = e.c, ray = shade(c, 0.9);
  stamp(OX + e.x, OY + e.y, r + 3, (x, y) => {
    const dd = Math.sqrt(x * x + y * y);
    if (dd <= r + 0.4) return dd > r - 0.8 ? shade(c, 1.15) : c;
    if (dd <= r + 2.6 && dd >= r + 1.2) {
      const ang = Math.atan2(y, x), slot = Math.PI / 4, off = Math.abs(((ang % slot) + slot) % slot - slot / 2);
      if (off > slot / 2 - 0.28) return ray;
    }
    return null;
  }, motionOf(e.motion, t, e.ph));
};
R.cloud = (e, t) => {
  const w = e.w, q = w / 4, c = e.c, under = shade(c, 0.82);
  const blobs = [[-q, 0.5, q + 0.8], [q, 0.5, q + 0.5], [0, -1.2, q + 1.4]];
  stamp(OX + e.x + w / 2, OY + e.y, w / 2 + 2, (x, y) => {
    if (y > 2) return null;
    for (const b of blobs) {
      const dx = x - b[0], dy = y - b[1];
      if (dx * dx + dy * dy <= b[2] * b[2]) return y >= 2 ? under : c;
    }
    return null;
  }, motionOf(e.motion, t, e.ph, 0.6));
};
R.rain = (e, t) => {
  const r = seeded(e.seed), c = e.c, v = SPD[e.speed] || 1;
  for (let i = 0; i < e.n; i++) {
    const x0 = r() * W, y0 = r() * (H + 4), sp = (13 + r() * 8) * v;
    const y = ((y0 + t * sp) % (H + 4)) - 3, x = wrapX(x0 - y * 0.18, 1);
    px(x, y, c);
    px(x + 0.18, y - 1, c, 0.55);
    if (v > 1.2) px(x + 0.36, y - 2, c, 0.3);
  }
};
R.snow = (e, t) => {
  const r = seeded(e.seed), c = e.c, v = SPD[e.speed] || 1;
  for (let i = 0; i < e.n; i++) {
    const x0 = r() * W, y0 = r() * (H + 2), sp = (2.5 + r() * 3) * v, ph = r() * 6.28;
    const y = ((y0 + t * sp) % (H + 2)) - 1, x = wrapX(x0 + Math.sin(t * 0.9 + ph) * 1.6, 1);
    px(x, y, c, 0.7 + 0.3 * Math.sin(ph + t));
  }
};
R.fire = (e, t) => {
  const half = Math.max(1, Math.floor(e.w / 2)), base = OY + e.y, cx = OX + e.x, hot = [255, 244, 190], mid = PAL.yellow || [255, 210, 63], c = e.c;
  const hmax = e.w * 0.9 + 2;
  for (let col = -half; col <= half; col++) {
    const edge = 1 - Math.abs(col) / (half + 1);
    const h = Math.max(1, hmax * edge * (0.55 + 0.45 * noise(e.seed + col * 31, t * 5.5)));
    for (let k = 0; k < h; k++) {
      const f = k / h;
      if (f > 0.75 && noise(e.seed + col * 7 + k * 3, t * 9) > 0.65) continue;
      const colr = f < 0.3 ? mix(hot, mid, f / 0.3) : f < 0.65 ? mix(mid, c, (f - 0.3) / 0.35) : shade(c, 1 - (f - 0.65) * 1.2);
      px(cx + col, base - k, colr, f > 0.85 ? 0.6 : 1);
    }
  }
  for (let i = 0; i < 3; i++) {
    const life = ((t * 0.7 + i / 3 + e.ph) % 1);
    px(cx + Math.sin((t + i) * 3) * half * 0.6, base - hmax - life * 6, mid, 1 - life);
  }
};
R.waves = (e, t) => {
  const c = e.c, v = SPD[e.speed] || 1, top = OY + e.y, foam = mix(c, WHITE, 0.55);
  for (let x = 0; x < W; x++) {
    const surf = top + Math.sin(x * 0.45 + t * 1.6 * v) * 0.9 + Math.sin(x * 0.17 - t * 0.9 * v + 1) * 0.7;
    const s0 = Math.round(surf);
    for (let y = Math.max(0, s0); y < H; y++) {
      const depth = (y - surf) / Math.max(4, H - top);
      px(x, y, y === s0 ? foam : shade(c, 1 - Math.min(0.55, depth * 0.6)));
    }
    if (noise(e.seed + x * 17, t * 1.3) > 0.86) px(x, s0 + 2 + (x % 3), foam, 0.5);
  }
};
R.hill = (e, t) => {
  const c = e.c, top = shade(c, 1.18), left = e.x <= 0 ? 0 : OX + e.x, right = e.x + e.w >= 32 ? W : OX + e.x + e.w;
  const bottom = e.y + e.h >= 31 ? H : OY + e.y + e.h, crest = OY + e.y;
  const full = e.x <= 0 && e.x + e.w >= 32;
  const cx = OX + e.x + e.w / 2, half = Math.max(1, e.w / 2);
  for (let x = Math.floor(left); x < right; x++) {
    let y0;
    if (full) y0 = crest + (1 - Math.cos((x / W) * Math.PI * 2 + e.ph)) * e.h * 0.16;
    else {
      const u = Math.max(-1, Math.min(1, (x + 0.5 - cx) / half));
      y0 = crest + e.h * (1 - Math.sqrt(1 - u * u));
    }
    const s0 = Math.round(y0);
    for (let y = s0; y < bottom; y++) px(x, y, y === s0 ? top : c);
  }
};
R.grass = (e, t) => {
  const c = e.c, dark = shade(c, 0.7), tip = shade(c, 1.15), y0 = OY + e.y, m = e.motion;
  for (let x = 0; x < W; x++) {
    for (let y = y0 + 1; y < H; y++) px(x, y, dark);
    const hgt = 1 + Math.floor(hash(e.seed + x * 101) * 3);
    let lean = 0;
    if (m === "sway") lean = Math.sin(t * 1.4 + x * 0.35) * 1.2;
    else if (m === "drift") lean = Math.sin(t * 2.4 + x * 0.6) * 0.8;
    else if (m === "bounce") lean = Math.abs(Math.sin(t * 2.6 + x * 0.3));
    for (let k = 0; k <= hgt; k++) {
      const f = hgt ? k / hgt : 0;
      px(x + Math.round(lean * f), y0 - k, k === hgt ? tip : c, m === "twinkle" ? 0.6 + 0.4 * noise(e.seed + x, t * 3) : 1);
    }
  }
};
R.tree = (e, t) => {
  const h = e.h, c = e.c, trunk = [124, 84, 48], light = shade(c, 1.2), cr = Math.max(2, Math.round(h * 0.33));
  const m = motionOf(e.motion, t, e.ph);
  const bx = OX + e.x, by = OY + e.y, tt = Math.round(h * 0.45);
  for (let k = 0; k < tt + 1; k++) {
    px(bx, by - k, trunk);
    if (h >= 10) px(bx + 1, by - k, shade(trunk, 0.8));
  }
  const top = by - Math.round(h * 0.62), lean = e.motion === "sway" ? Math.round(m.dx) : 0;
  stamp(bx + lean, top, cr + 1, (x, y) => {
    const dd = x * x + (y * 1.1) * (y * 1.1);
    if (dd > cr * cr + cr * 0.6) return null;
    return x + y < -cr * 0.6 ? light : c;
  }, e.motion === "sway" ? { dx: 0, dy: 0, a: 0, k: 1, s: 1 } : m);
};
R.flower = (e, t) => {
  const c = e.c, stem = PAL.green || [63, 191, 95], m = motionOf(e.motion, t, e.ph);
  const bx = OX + e.x, by = OY + e.y, lean = Math.round(m.dx);
  for (let k = 0; k < 4; k++) px(bx + (k > 2 ? lean : 0), by - k, stem);
  px(bx + 1, by - 1, stem, 0.8);

function aim(people) {

function lookAt(d) {

}

function eyesEvent(data) {
  EYE.on = !!data.on;
  EYE.want = data.camera === "rear" ? "rear" : "front";
  EYE.seq = data.seq | 0;
  applyEyes();
}
function eyesTouched() {
  if (EYE.touched) return;
  EYE.touched = true;
  if (EYE.on && !EYE.live) applyEyes();
}
function applyEyes() {
  EYE.job = EYE.job.then(applyNow, applyNow);
}
async function applyNow() {
  if (!EYE.cfg.camera) return;
  const seq = EYE.seq;
  if (!EYE.on) {
    stopSource();
    EYE.cam = null;
    report("off");
    return;
  }
  if (!EYE.cfg.assets) { report("failed", "the eye files are missing; run python -m pebble.web.fetch_eyes"); return; }
  const cam = EYE.pin === "rear" || EYE.pin === "front" ? EYE.pin : EYE.want;
  if (EYE.live && EYE.cam === cam) {
    EYE.applied = seq;
    report("on");
    return;
  }
  if (EYE.source === "camera" && !EYE.granted && !EYE.touched) { report("waiting", "touch the screen to let Pebble see"); return; }
  report("starting");
  stopSource();
  try {
    const engine = await engineReady(30000);
    if (!engine) throw new Error("the eyes did not load in time");
    if (!engine.faces && !engine.bodies && !engine.tags) throw new Error("the eyes could not load: " + (engine.errors || []).join("; "));
    await startSource(cam);
    EYE.cam = cam;
    EYE.live = true;
    EYE.applied = seq;
    report("on");
  } catch (err) {

    report("failed", why(err));
  }
  if (EYE.seq !== seq) applyEyes();
}
function stopSource() {
  clearTimeout(EYE.timer);
  EYE.timer = 0;
  EYE.loopId++;
  if (EYE.stream) EYE.stream.getTracks().forEach(tr => tr.stop());
  EYE.stream = null;
  if (EYE.video) EYE.video.srcObject = null;
  EYE.live = false;
  EYE.busy = false;
  EYE.img = null;
  EYE.scene = null;
  EYE.lastSeen = 0;
  SEEN.until = 0;
}
function videoEl() {
  if (!EYE.video) {
    const v = document.createElement("video");
    v.muted = true;
    v.playsInline = true;
    v.setAttribute("playsinline", "");
    v.setAttribute("muted", "");
    v.style.cssText = "position:fixed;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none";
    document.body.appendChild(v);

}
async function openCamera(cam) {
  const size = cam === "rear" ? [1280, 960] : [640, 480];
  const base = { width: { ideal: size[0] }, height: { ideal: size[1] }, frameRate: { ideal: 30, max: 30 } };
  const ask = video => navigator.mediaDevices.getUserMedia({ video: Object.assign({}, base, video), audio: false });
  try {
    return await ask({ facingMode: { exact: cam === "rear" ? "environment" : "user" } });
  } catch (err) {
    if (err && (err.name === "NotAllowedError" || err.name === "SecurityError")) throw err;
    const devices = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === "videoinput");
    const pick = devices.find(d => (cam === "rear" ? /back|rear|environment/i : /front|user|face/i).test(d.label));
    if (pick) return ask({ deviceId: { exact: pick.deviceId } });
    if (cam === "front" && devices.length) return ask({});

  }
}
async function startSource(cam) {
  if (EYE.source === "image") {
    EYE.img = await loadImage(Q.get("src") || "/vendor/samples/portrait.jpg");
    loopTimer();
    return;
  }
  if (EYE.source === "scene") {
    EYE.scene = makeScene(cam);
    loopTimer();
    return;
  }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error("this browser cannot open the camera here; open the page at 127.0.0.1 on the phone itself");
  if (EYE.hadStream) await sleep(250);
  const stream = await openCamera(cam);
  EYE.hadStream = true;
  EYE.granted = true;
  EYE.stream = stream;
  const v = videoEl();
  v.srcObject = stream;
  await v.play();
  stream.getVideoTracks().forEach(tr => tr.addEventListener("ended", () => {
    if (EYE.stream !== stream) return;
    stopSource();
    report("failed", "the camera stopped");
    setTimeout(applyEyes, 3000);
  }));
  loopVideo();
}
function loadImage(src) {
  return new Promise((ok, bad) => {
    const i = new Image();
    i.onload = () => ok(i);
    i.onerror = () => bad(new Error("cannot load the test picture " + src));
    i.src = src;
  });
}
function loopVideo() {
  const id = EYE.loopId, v = EYE.video;
  const step = (stamp, meta) => {
    if (id !== EYE.loopId) return;
    let t = now();
    if (meta && meta.captureTime && Math.abs(meta.captureTime / 1000 - t) < 2) t = meta.captureTime / 1000;
    pump(v, v.videoWidth, v.videoHeight, t);
    if (v.requestVideoFrameCallback) v.requestVideoFrameCallback(step);
    else EYE.timer = setTimeout(step, 30);
  };
  if (v.requestVideoFrameCallback) v.requestVideoFrameCallback(step);
  else step();
}
function loopTimer() {
  const id = EYE.loopId;
  const step = () => {
    if (id !== EYE.loopId) return;
    const t = now();
    if (EYE.scene && EYE.scene.moving) drawTagScene(EYE.scene, t);
    const src = EYE.img || EYE.scene.canvas;
    pump(src, src.naturalWidth || src.width, src.naturalHeight || src.height, t);
    EYE.timer = setTimeout(step, 30);
  };
  step();
}
function pump(src, w, h, t) {
  if (!EYE.ready || EYE.busy || !EYE.live || !w || !h) return;
  const maxFps = EYE.fallback ? 5 : clamp(+Q.get("fps") || 15, 1, 30), tn = now();
  if (tn - EYE.lastFrame < 1 / maxFps - 0.004) return;
  EYE.lastFrame = tn;
  const cam = EYE.cam, k = Math.min(1, (cam === "rear" ? 1280 : 640) / Math.max(w, h));
  const opts = k < 1 ? { resizeWidth: Math.round(w * k), resizeHeight: Math.round(h * k), resizeQuality: "medium" } : {};
  const msg = { op: "frame", camera: cam, fov: fovOf(cam), mirror: !!camSetting(cam, "mirror"), rotate: rotationOf(cam, w, h), people: (Q.get("people") || EYE.cfg.people) !== "none", tags: cam === "rear" || Q.get("tags") === "both", t: t, seq: EYE.applied, fps: maxFps };
  EYE.busy = true;

    msg.bitmap = bm;
    EYE.worker.postMessage(msg, EYE.fallback ? [] : [bm]);

}

function makeScene(cam) {
  const w = +Q.get("w") || (cam === "rear" ? 1280 : 640), h = +Q.get("h") || Math.round(w * 3 / 4);
  const c = document.createElement("canvas");
  c.width = w;
  c.height = h;

  return sc;
}
function sceneTag(sc, t) {
  const num = (k, d) => { const v = parseFloat(Q.get(k)); return isFinite(v) ? v : d; };
  const p = { d: num("tag_d", 0.5), b: num("tag_b", 0), e: num("tag_e", 0), yaw: num("tag_yaw", 0), size: num("tag_size", (EYE.cfg.tag && EYE.cfg.tag.size_m) || 0.06) };

  sc.truth = p;

  g.addColorStop(1, "#5a5e66");

  const B = p.b * rad, El = p.e * rad, A = (p.yaw - p.b) * rad;
  const T = [p.d * Math.sin(B) * Math.cos(El), -p.d * Math.sin(El), p.d * Math.cos(B) * Math.cos(El)];

  let x0 = w, y0 = h, x1 = 0, y1 = 0;
  [[-1, -1], [1, -1], [1, 1], [-1, 1]].forEach(s => {
    const P = [T[0] + s[0] * half * Rv[0], T[1] + s[1] * half, T[2] + s[0] * half * Rv[2]];
    if (P[2] <= 0.01) return;

  });
  x0 = clamp(Math.floor(x0) - 1, 0, w); y0 = clamp(Math.floor(y0) - 1, 0, h);
  x1 = clamp(Math.ceil(x1) + 1, 0, w); y1 = clamp(Math.ceil(y1) + 1, 0, h);
  if (x1 <= x0 || y1 <= y0) return;
  const im = x.getImageData(x0, y0, x1 - x0, y1 - y0), px4 = im.data, bw = x1 - x0, nt = N[0] * T[0] + N[2] * T[2];

    let sum = 0, hits = 0;
    for (let sy = 0; sy < 3; sy++) for (let sx = 0; sx < 3; sx++) {
      const dx = (x0 + i + (sx + 0.5) / 3 - cx) / f, dy = (y0 + j + (sy + 0.5) / 3 - cy) / f;
      const nd = N[0] * dx + N[2];

      const q0 = lam * dx - T[0], q1 = lam * dy - T[1], q2 = lam - T[2];

      if (a < 0 || b < 0 || a >= 10 || b >= 10) continue;

    }
    if (!hits) continue;
    const k = (j * bw + i) * 4, cover = hits / 9, val = sum / hits;
    for (let c = 0; c < 3; c++) px4[k + c] = px4[k + c] * (1 - cover) + val * cover;
  }

}

function eyesDebug() {
  return { status: EYE.status, on: EYE.on, want: EYE.want, seq: EYE.seq, applied: EYE.applied, camera: EYE.cam, live: EYE.live, source: EYE.source, ready: EYE.ready, engine: EYE.engine, fallback: EYE.fallback, fps: EYE.fps, frames: EYE.frames, last: EYE.last, truth: EYE.scene ? EYE.scene.truth : null, seen: { x: SEEN.x, y: SEEN.y, w: SEEN.w, track: SEEN.track } };
}
function eyesLine() {
  if (!EYE.cfg.camera) return "";
  const r = EYE.last;
  return "\neyes " + EYE.status + (EYE.live ? " " + EYE.cam + " " + EYE.fps.toFixed(0) + "/s" + (r ? " " + r.people.length + "p " + r.tags.length + "t" : "") : "");
}

function now() {
  return performance.now() / 1000;
}
let lastT = now(), frames = 0, fpsAt = now(), fps = 0;
let shown = null, changedAt = now(), pending = false, waiting = 0;
const IDLE_AFTER = 0.25, IDLE_MS = 50;
const EARS = { on: false, words: false, muted: false };
function drawEars() {
  if (!EARS.on && !EARS.muted) return;
  const c = EARS.muted ? [150, 150, 160] : (EARS.words ? [120, 190, 255] : [90, 120, 170]);
  const a = EARS.muted ? 0.5 : (EARS.words ? 0.8 : 0.45);
  const x = SH.mx, y = SH.my;
  px(x + 4, y, c, a); px(x + 3, y + 1, c, a); px(x + 4, y + 2, c, a);
  px(x + 5, y, c, a); px(x + 6, y + 1, c, a); px(x + 5, y + 2, c, a);
  if (EARS.muted) { const r = [230, 70, 60]; px(x + 3, y + 3, r, 0.85); px(x + 4, y + 2, r, 0.85); px(x + 5, y + 1, r, 0.85); px(x + 6, y, r, 0.85); }
}
function drawSeeing() {
  if (EYE.live || EYE.brainCam) px(1 + SH.mx, 1 + SH.my, [80, 220, 120], 0.7);
}
function render(t) {
  const dt = Math.min(0.1, Math.max(0, t - lastT));
  lastT = t;
  updateFace(t, dt);
  shiftAt(t);
  if (target.alarm) {
    drawAlarm(t, String(target.alarm));
    drawSeeing();
    drawEars();
    present();
    return;
  }
  fill(BG);
  const a = sceneAlpha(t);
  if (!scene || scene.mode === "overlay" || a < 1) drawFace(t);
  if (scene && a > 0) {
    LA = a;
    drawScene(t, scene.mode === "overlay");
    LA = 1;
  }
  drawRipples(t);
  if (linkDownSince && t - linkDownSince > 3) px(W - 2 - SH.mx, 1 + SH.my, [200, 40, 40], 0.8);
  drawSeeing();
  drawEars();
  present();
}
function present() {
  const u = new Uint32Array(d.buffer);
  if (shown && shown.length === u.length) {
    let same = true;
    for (let i = 0; i < u.length; i++) if (u[i] !== shown[i]) { same = false; break; }
    if (same) return;
    shown.set(u);
  } else {
    shown = u.slice();
  }
  changedAt = now();
  ctx.putImageData(img, 0, 0);
}
function schedule() {
  if (pending || waiting) return;
  if (now() - changedAt < IDLE_AFTER) {

    requestAnimationFrame(tick);
  } else {
    waiting = setTimeout(() => { waiting = 0; pending = true; requestAnimationFrame(tick); }, IDLE_MS);
  }
}
function tick() {
  pending = false;
  frame();
}
function rouse() {
  changedAt = now();
  if (waiting) {
    clearTimeout(waiting);
    waiting = 0;
    schedule();
  }
}
function bench(n) {
  const count = Math.max(1, n | 0), t0 = performance.now();
  for (let i = 0; i < count; i++) render(now());
  return (performance.now() - t0) / count;
}
function frame() {
  const t = now();
  render(t);
  frames++;
  if (t - fpsAt >= 1) {
    fps = frames / (t - fpsAt);
    frames = 0;
    fpsAt = t;
    if (DEBUG) dbg.textContent = fps.toFixed(0) + " fps  " + W + "x" + H + "\n" + target.expression + "  chaos " + (+target.chaos).toFixed(1) + (scene ? "\nscene " + scene.id + " " + scene.els.length + " lines" : "") + eyesLine();
  }
  schedule();
}
function start(reg) {
  REG = reg;
  PAL = {};
  Object.keys((reg && reg.palette) || {}).forEach(k => { PAL[k] = hex(reg.palette[k]); });
  if (reg && reg.elements) {
    const missing = Object.keys(reg.elements).filter(n => !R[n]);
    if (missing.length) console.warn("no drawing for", missing.join(", "));
  }
  if (DEBUG) dbg.style.display = "block";
  window.pebble = { apply: apply, render: render, bench: bench, now: now, state: () => ({ target: target, shape: F.shape, scene: scene, W: W, H: H, fps: fps }), elements: Object.keys(R), eyes: eyesDebug };
  resize();
  window.addEventListener("resize", resize);
  eyesBoot();
  connect();
  schedule();
}
let reg = null;
try { reg = JSON.parse(document.getElementById("registry").textContent); } catch (err) { reg = null; }
if (reg) start(reg);
else fetch("/elements.json").then(r => r.json()).then(start).catch(() => start(null));
})();
